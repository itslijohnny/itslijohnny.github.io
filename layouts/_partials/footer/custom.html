<script>
    // Category chip rows on list cards are single-line and horizontally
    // scrollable with a hidden scrollbar; translate the mouse wheel into
    // horizontal scrolling when (and only when) a row actually overflows.
    document.addEventListener("wheel", function (e) {
        if (!e.target.closest) return;
        var row = e.target.closest(".article-list .article-category");
        if (!row || row.scrollWidth <= row.clientWidth) return;
        var delta = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
        row.scrollLeft += delta;
        e.preventDefault();
    }, { passive: false });
</script>

<script>
/* ------------------------------------------------------------------
   About page artwork. Every graphic is drawn here from the site
   palette, so the page ships no image files and both colour schemes
   get their own version rather than one being a washed-out copy.
   ------------------------------------------------------------------ */
(function () {
    var isDark = function () {
        return document.documentElement.dataset.scheme === "dark";
    };

    function palette() {
        return isDark()
            ? { accent: "69,197,182", deep: "138,92,192", warm: "224,168,60", ink: "232,233,241" }
            : { accent: "19,122,115", deep: "70,25,107", warm: "154,106,6", ink: "0,0,0" };
    }

    // light marks need more alpha to register against paper
    function A(darkValue) { return isDark() ? darkValue : Math.min(darkValue * 1.85, 0.42); }
    function rgba(c, a) { return "rgba(" + c + "," + a + ")"; }

    // deterministic RNG so a repaint looks identical to the first paint
    function rng(seed) { var s = seed; return function () { return (s = s * 16807 % 2147483647) / 2147483647; }; }

    var painters = {
        mesh: function (ctx, w, h, P) {
            [[w * 0.1, h * 0.15, w * 0.55, P.accent, A(0.26)],
             [w * 0.86, h * 0.2, w * 0.4, P.deep, A(0.14)],
             [w * 0.6, h * 1.0, w * 0.5, P.warm, A(0.1)]].forEach(function (b) {
                var g = ctx.createRadialGradient(b[0], b[1], 0, b[0], b[1], b[2]);
                g.addColorStop(0, rgba(b[3], b[4]));
                g.addColorStop(1, rgba(b[3], 0));
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, w, h);
            });
            ctx.strokeStyle = rgba(P.ink, A(0.05));
            for (var x = 0; x <= w; x += 34) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
        },

        banner: function (ctx, w, h, P) {
            painters.mesh(ctx, w, h, P);
            var cx = w * 0.84, cy = h * 0.5;
            ctx.strokeStyle = rgba(P.accent, A(0.22));
            ctx.setLineDash([3, 5]);
            [h * 0.3, h * 0.48, h * 0.68].forEach(function (r) {
                ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
            });
            ctx.setLineDash([]);
            var rnd = rng(7);
            for (var i = 0; i < 26; i++) {
                var a = rnd() * Math.PI * 2, r = h * (0.28 + rnd() * 0.42);
                ctx.fillStyle = rgba(rnd() > 0.5 ? P.accent : P.deep, A(0.5));
                ctx.beginPath();
                ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 1.6, 0, Math.PI * 2);
                ctx.fill();
            }
        },

        bars: function (ctx, w, h, P) {
            var n = 9, bw = w / (n * 1.9), rnd = rng(11);
            for (var i = 0; i < n; i++) {
                var bh = h * (0.18 + rnd() * 0.5) * ((i + 3) / (n + 2));
                ctx.fillStyle = rgba(P.accent, A(0.2));
                ctx.fillRect(w - (n - i) * bw * 1.8, h - bh, bw, bh);
            }
        },

        flow: function (ctx, w, h, P) {
            for (var k = 0; k < 5; k++) {
                ctx.beginPath();
                for (var x = 0; x <= w; x += 4) {
                    var y = h * 0.55 + Math.sin(x / w * Math.PI * 2 + k * 0.7) * h * (0.1 + k * 0.045);
                    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                }
                ctx.strokeStyle = rgba(k % 2 ? P.deep : P.accent, A(0.3) - k * 0.035);
                ctx.lineWidth = 1.4;
                ctx.stroke();
            }
        },

        nodes: function (ctx, w, h, P) {
            var pts = [[0.22, 0.3], [0.55, 0.62], [0.82, 0.26], [0.42, 0.84], [0.72, 0.72]];
            ctx.strokeStyle = rgba(P.accent, A(0.22));
            ctx.lineWidth = 1;
            for (var i = 0; i < pts.length; i++) {
                for (var j = i + 1; j < pts.length; j++) {
                    ctx.beginPath();
                    ctx.moveTo(pts[i][0] * w, pts[i][1] * h);
                    ctx.lineTo(pts[j][0] * w, pts[j][1] * h);
                    ctx.stroke();
                }
            }
            pts.forEach(function (pt, i) {
                ctx.fillStyle = rgba(i < 3 ? P.accent : P.deep, A(0.55));
                ctx.beginPath();
                ctx.arc(pt[0] * w, pt[1] * h, i < 3 ? 3.4 : 2.4, 0, Math.PI * 2);
                ctx.fill();
            });
        },

        ticks: function (ctx, w, h, P) {
            for (var i = 0; i < 26; i++) {
                var x = w - i * (w / 26) - 6, tall = i % 4 === 0;
                ctx.fillStyle = rgba(tall ? P.accent : P.ink, tall ? A(0.3) : A(0.12));
                ctx.fillRect(x, h - (tall ? h * 0.3 : h * 0.16), 1.6, tall ? h * 0.3 : h * 0.16);
            }
        },

        grid: function (ctx, w, h, P) {
            var g = ctx.createLinearGradient(0, 0, w, h);
            g.addColorStop(0, rgba(P.accent, A(0.16)));
            g.addColorStop(1, rgba(P.accent, 0));
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, w, h);
            ctx.strokeStyle = rgba(P.accent, A(0.2));
            ctx.lineWidth = 1;
            for (var i = 0; i <= 9; i++) {
                var x = (i / 9) * w * 1.1 - w * 0.05;
                ctx.beginPath();
                ctx.moveTo(x, h);
                ctx.lineTo(w * 0.58 + x * 0.3, h * 0.3);
                ctx.stroke();
            }
            for (var j = 1; j <= 4; j++) {
                var y = h - Math.pow(j / 5, 1.7) * h * 0.85;
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
            }
        },

        scatter: function (ctx, w, h, P) {
            var rnd = rng(23);
            function gauss() {
                var u = 0, v = 0;
                while (!u) u = rnd();
                while (!v) v = rnd();
                return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
            }
            [[w * 0.82, h * 0.24, P.deep], [w * 0.97, h * 0.44, P.warm]].forEach(function (c) {
                for (var i = 0; i < 200; i++) {
                    var gx = gauss(), gy = gauss();
                    var d = Math.min(1, Math.hypot(gx, gy) / 2.6);
                    ctx.fillStyle = rgba(c[2], A(0.5) * (1 - d) + 0.03);
                    ctx.beginPath();
                    ctx.arc(c[0] + gx * w * 0.058, c[1] + gy * h * 0.13, 1.1 + (1 - d) * 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        },

        wave: function (ctx, w, h, P) {
            for (var k = 3; k >= 0; k--) {
                ctx.beginPath();
                ctx.moveTo(0, h);
                for (var x = 0; x <= w; x += 4) {
                    ctx.lineTo(x, h * (0.5 + k * 0.1) + Math.sin(x / w * Math.PI * 1.6 + k) * h * 0.12);
                }
                ctx.lineTo(w, h);
                ctx.closePath();
                ctx.fillStyle = rgba(k % 2 ? P.accent : P.warm, A(0.2) - k * 0.018);
                ctx.fill();
            }
        }
    };

    function paintAll() {
        var P = palette();
        document.querySelectorAll("canvas[data-paint]").forEach(function (cv) {
            var r = cv.getBoundingClientRect();
            if (!r.width || !r.height) return;
            var d = Math.min(window.devicePixelRatio || 1, 2);
            cv.width = Math.round(r.width * d);
            cv.height = Math.round(r.height * d);
            var ctx = cv.getContext("2d");
            ctx.setTransform(d, 0, 0, d, 0, 0);
            ctx.clearRect(0, 0, r.width, r.height);
            (painters[cv.dataset.paint] || painters.mesh)(ctx, r.width, r.height, P);
        });
    }

    /* --- skill graph --------------------------------------------------
       A sphere of skills: hue = domain, lines = relationships. It turns
       slowly, answers the pointer, and selecting a skill lights up
       everything it connects to — which is the only reason the edges are
       worth drawing at all. Data comes from the <li> list in the
       shortcode, so adding a skill never means touching this file.
       ----------------------------------------------------------------- */
    var GROUP_KEY = { data: "accent", ai: "deep", viz: "warm" };
    var DEPTH = 2.4;                   // camera distance in sphere radii
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var graphs = [];

    function buildGraph(box) {
        // build once per element: render() runs again on load and resize, and
        // re-attaching listeners would leave stale copies bound to the canvas
        if (box.__graph) { graphs.push(box.__graph); return; }
        var cv = box.querySelector(".graph-canvas");
        var readout = box.querySelector("[data-graph-readout]");
        var items = [].slice.call(box.querySelectorAll(".graph-data li"));
        if (!cv || !items.length) return;

        var byId = {}, nodes = [], groups = {};
        items.forEach(function (li) {
            var g = li.dataset.group || "data";
            var n = {
                id: li.dataset.id,
                label: (li.textContent || "").trim(),
                group: g,
                rel: (li.dataset.rel || "").split(/\s+/).filter(Boolean),
                nb: []
            };
            byId[n.id] = n;
            nodes.push(n);
            (groups[g] = groups[g] || []).push(n);
        });

        // relationships are mutual: naming one direction is enough
        var edges = [], seen = {};
        nodes.forEach(function (n) {
            n.rel.forEach(function (id) {
                var m = byId[id];
                if (!m || m === n) return;
                var key = [n.id, m.id].sort().join("|");
                if (seen[key]) return;
                seen[key] = 1;
                edges.push([n, m]);
                n.nb.push(m);
                m.nb.push(n);
            });
        });

        // Fibonacci sphere over every node, ordered by domain — even
        // coverage (so it reads as a globe) with each domain occupying a
        // contiguous band rather than a lopsided cluster.
        var GOLDEN = Math.PI * (3 - Math.sqrt(5));
        var ORDER = { data: 0, ai: 1, viz: 2 };
        var placed = nodes.slice().sort(function (a, b) {
            return (ORDER[a.group] - ORDER[b.group]) || 0;
        });
        placed.forEach(function (n, i) {
            var y = 1 - ((i + 0.5) / placed.length) * 2;
            var rr = Math.sqrt(Math.max(0, 1 - y * y));
            var th = i * GOLDEN;
            n.p = [Math.cos(th) * rr, y, Math.sin(th) * rr];
        });

        var st = {
            box: box, cv: cv, readout: readout, nodes: nodes, edges: edges,
            yaw: 0.6, pitch: -0.18, spin: reduce ? 0 : 0.00013,
            vy: 0, vp: 0, drag: null, moved: 0,
            hover: null, pick: null, aim: null, over: false, slow: 1, visible: true, w: 0, h: 0
        };

        function aimAt(n) {
            if (!n) { st.aim = null; return; }
            // yaw swings the node's x/z into +z; pitch then lifts y onto it.
            // Clamped inside the pitch limit so polar nodes still settle.
            st.aim = {
                yaw: -Math.atan2(n.p[0], n.p[2]),
                pitch: Math.max(-1, Math.min(1, Math.asin(Math.max(-1, Math.min(1, n.p[1])))))
            };
            st.vy = st.vp = 0;
        }
        st.aimAt = aimAt;

        cv.tabIndex = 0;

        function nodeAt(px, py) {
            var best = null, bestD = 22;
            for (var i = 0; i < nodes.length; i++) {
                var n = nodes[i];
                if (n.sx == null) continue;
                var d = Math.hypot(n.sx - px, n.sy - py);
                // front-facing nodes win ties, they are what the eye is on
                if (d < bestD * (0.6 + 0.6 * n.t)) { bestD = d; best = n; }
            }
            return best;
        }

        function localPoint(e) {
            var r = cv.getBoundingClientRect();
            return [e.clientX - r.left, e.clientY - r.top];
        }

        // Pointer capture fires spurious boundary events that wiped the
        // hover state, so the drag is tracked on window instead.
        function onMove(e) {
            var pt = localPoint(e);
            var dx = pt[0] - st.drag[0], dy = pt[1] - st.drag[1];
            st.moved += Math.abs(dx) + Math.abs(dy);
            st.yaw += dx * 0.008;
            st.pitch = Math.max(-1.1, Math.min(1.1, st.pitch + dy * 0.006));
            st.vy = dx * 0.008;
            st.vp = dy * 0.006;
            st.drag = pt;
            if (reduce) draw(st, performance.now());
        }

        function onUp(e) {
            window.removeEventListener("pointermove", onMove);
            window.removeEventListener("pointerup", onUp);
            var wasDrag = st.moved > 6;
            st.drag = null;
            if (wasDrag) return;
            var pt = localPoint(e);
            var hit = nodeAt(pt[0], pt[1]);
            st.pick = (hit && hit === st.pick) ? null : hit;   // click again to clear
            st.hover = hit;
            aimAt(st.pick);
            say(st);
            if (reduce) draw(st, performance.now());
        }

        cv.addEventListener("pointerdown", function (e) {
            st.drag = localPoint(e);
            st.moved = 0;
            st.vy = st.vp = 0;
            window.addEventListener("pointermove", onMove);
            window.addEventListener("pointerup", onUp);
        });

        cv.addEventListener("pointermove", function (e) {
            if (st.drag) return;
            var pt = localPoint(e);
            var hit = nodeAt(pt[0], pt[1]);
            if (hit !== st.hover) {
                st.hover = hit;
                cv.style.cursor = hit ? "pointer" : "grab";
                say(st);
                if (reduce) draw(st, performance.now());
            }
        });

        cv.addEventListener("pointerenter", function () { st.over = true; });

        cv.addEventListener("pointerleave", function () {
            st.over = false;
            if (st.drag || !st.hover) return;
            st.hover = null;
            say(st);
            if (reduce) draw(st, performance.now());
        });

        cv.addEventListener("keydown", function (e) {
            if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
            e.preventDefault();
            var i = st.pick ? nodes.indexOf(st.pick) : -1;
            i = (i + (e.key === "ArrowRight" ? 1 : nodes.length - 1) + nodes.length) % nodes.length;
            st.pick = nodes[i];
            aimAt(st.pick);   // turn the globe so the choice faces the viewer
            say(st);
            if (reduce) draw(st, performance.now());
        });
        cv.addEventListener("blur", function () { st.pick = null; say(st); });

        if (window.IntersectionObserver) {
            new IntersectionObserver(function (es) {
                st.visible = es[0].isIntersecting;
            }, { threshold: 0 }).observe(box);
        }

        box.__graph = st;
        graphs.push(st);
        say(st);
        draw(st, performance.now());
    }

    function say(st) {
        if (!st.readout) return;
        var n = st.pick || st.hover;
        if (!n) {
            st.readout.innerHTML = '<span class="muted">' + st.nodes.length +
                " skills · hover or click one to see what it connects to</span>";
            return;
        }
        var names = n.nb.map(function (m) { return m.label; });
        st.readout.innerHTML = "<b>" + n.label + "</b> " +
            (names.length ? '<span class="muted">→ ' + names.join(" · ") + "</span>"
                          : '<span class="muted">→ standalone</span>');
    }

    function draw(st, t) {
        var cv = st.cv, r = cv.getBoundingClientRect();
        if (!r.width || !r.height) return;
        var d = Math.min(window.devicePixelRatio || 1, 2);
        if (cv.width !== Math.round(r.width * d)) {
            cv.width = Math.round(r.width * d);
            cv.height = Math.round(r.height * d);
        }
        st.w = r.width; st.h = r.height;
        var ctx = cv.getContext("2d");
        ctx.setTransform(d, 0, 0, d, 0, 0);
        ctx.clearRect(0, 0, r.width, r.height);

        var P = palette();
        var hues = { accent: P.accent, deep: P.deep, warm: P.warm };
        var cx = r.width / 2, cy = r.height / 2;
        var R = Math.min(r.width, r.height) * 0.37;
        var cosY = Math.cos(st.yaw), sinY = Math.sin(st.yaw);
        var cosP = Math.cos(st.pitch), sinP = Math.sin(st.pitch);

        st.nodes.forEach(function (n) {
            var x = n.p[0], y = n.p[1], z = n.p[2];
            var x1 = x * cosY + z * sinY, z1 = -x * sinY + z * cosY;
            var y2 = y * cosP - z1 * sinP, z2 = y * sinP + z1 * cosP;
            var k = DEPTH / (DEPTH - z2);
            n.sx = cx + x1 * R * k;
            n.sy = cy + y2 * R * k;
            n.sz = z2;
            n.k = k;
            n.t = (z2 + 1) / 2;                  // 0 at the back, 1 at the front
        });

        var focus = st.pick || st.hover;
        var lit = null;
        if (focus) {
            lit = {};
            lit[focus.id] = 2;
            focus.nb.forEach(function (m) { if (!lit[m.id]) lit[m.id] = 1; });
        }

        // edges first, so the dots sit on top of their own connections
        st.edges.forEach(function (e) {
            var a = e[0], b = e[1];
            var near = Math.max(a.t, b.t);
            var on = lit ? (lit[a.id] && lit[b.id] && (lit[a.id] === 2 || lit[b.id] === 2)) : false;
            var alpha = lit
                ? (on ? A(0.55) * (0.45 + 0.55 * near) : A(0.06) * near)
                : A(0.26) * (0.2 + 0.8 * near);
            if (alpha < 0.012) return;
            ctx.beginPath();
            ctx.moveTo(a.sx, a.sy);
            ctx.lineTo(b.sx, b.sy);
            ctx.strokeStyle = rgba(hues[GROUP_KEY[on ? focus.group : a.group]], alpha);
            ctx.lineWidth = on ? 1.3 : 0.9;
            ctx.stroke();
        });

        // then nodes, back to front
        var order = st.nodes.slice().sort(function (m, n) { return m.sz - n.sz; });
        order.forEach(function (n) {
            var hue = hues[GROUP_KEY[n.group]];
            var state = lit ? (lit[n.id] || 0) : 1;
            var dim = lit && !state;
            var dotA = dim ? A(0.16) * n.t : A(0.6) * (0.35 + 0.65 * n.t);
            var rad = (1.5 + 1.7 * n.t) * n.k * (state === 2 ? 2.15 : 1);

            if (state === 2) {
                ctx.beginPath();
                ctx.arc(n.sx, n.sy, rad + 7, 0, Math.PI * 2);
                ctx.fillStyle = rgba(hue, A(0.2));
                ctx.fill();
                ctx.beginPath();
                ctx.arc(n.sx, n.sy, rad + 4.5, 0, Math.PI * 2);
                ctx.strokeStyle = rgba(hue, A(0.8));
                ctx.lineWidth = 1.2;
                ctx.stroke();
            }
            ctx.beginPath();
            ctx.arc(n.sx, n.sy, rad, 0, Math.PI * 2);
            ctx.fillStyle = rgba(hue, state === 2 ? A(0.95) : dotA);
            ctx.fill();
        });

        // labels last, nearest first, and any that would collide with one
        // already drawn is skipped — it becomes readable as the globe turns
        var taken = [];
        st.nodes.slice()
            .sort(function (m, n) {
                var ms = lit ? (lit[m.id] || 0) : 0, ns = lit ? (lit[n.id] || 0) : 0;
                return (ns - ms) || (n.t - m.t);          // selection first, then nearest
            })
            .forEach(function (n) {
                var state = lit ? (lit[n.id] || 0) : 1;
                var dim = lit && !state;
                if (!state && n.t < 0.5) return;
                if (dim && n.t < 0.7) return;
                if (!lit && n.t < 0.42) return;

                var size = (9.6 + 3.2 * n.t) * (state === 2 ? 1.14 : 1);
                ctx.font = (state === 2 ? "700 " : "500 ") + size.toFixed(1) +
                    'px ui-monospace, SFMono-Regular, Menlo, monospace';
                var tw = ctx.measureText(n.label).width;
                var rad = (1.5 + 1.7 * n.t) * n.k * (state === 2 ? 1.9 : 1);
                var toRight = n.sx <= cx;                 // text goes to the roomier side
                var tx = toRight ? n.sx + rad + 6 : n.sx - rad - 6 - tw;
                if (tx < 2 || tx + tw > r.width - 2) return;

                var box = [tx - 2, n.sy - size * 0.72, tx + tw + 2, n.sy + size * 0.72];
                for (var i = 0; i < taken.length; i++) {
                    var q = taken[i];
                    if (box[0] < q[2] && box[2] > q[0] && box[1] < q[3] && box[3] > q[1]) return;
                }
                taken.push(box);

                var labA = state === 2 ? A(0.98)
                         : dim ? A(0.16)
                         : lit ? Math.max(A(0.55), A(0.72) * Math.pow(n.t, 1.1))
                         : A(0.72) * Math.pow(n.t, 1.1);
                if (labA < 0.06) return;
                ctx.fillStyle = rgba(P.ink, Math.min(labA, 1));
                ctx.textBaseline = "middle";
                ctx.fillText(n.label, tx, n.sy);
            });
    }

    function frameLoop(t) {
        for (var i = 0; i < graphs.length; i++) {
            var st = graphs[i];
            if (!st.visible) continue;
            if (!st.drag) {
                if (st.aim) {
                    // shortest way round to the skill that was clicked
                    var dy = ((st.aim.yaw - st.yaw + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
                    var dp = st.aim.pitch - st.pitch;
                    st.yaw += dy * 0.1;
                    st.pitch = Math.max(-1.1, Math.min(1.1, st.pitch + dp * 0.1));
                    if (Math.abs(dy) < 0.02 && Math.abs(dp) < 0.02) st.aim = null;
                } else {
                    // The pointer eases the spin down to a crawl rather than
                    // stopping it: aiming at a fast-moving target is the one
                    // thing that makes this annoying, but a dead globe looks
                    // broken. Eased so the change in speed is never abrupt.
                    st.slow += ((st.over ? 0.12 : 1) - st.slow) * 0.08;
                    st.yaw += st.spin * 16 * st.slow + st.vy;
                    st.pitch = Math.max(-1.1, Math.min(1.1, st.pitch + st.vp));
                    st.vy *= 0.94;
                    st.vp *= 0.94;
                }
            }
            draw(st, t);
        }
        requestAnimationFrame(frameLoop);
    }

    var looping = false;
    function startLoop() {
        if (looping || reduce) return;
        looping = true;
        requestAnimationFrame(frameLoop);
    }

    function buildAll() {
        graphs = [];
        document.querySelectorAll("[data-skill-graph]").forEach(buildGraph);
    }

    function render() { buildAll(); paintAll(); }

    /* count the big numbers up once they're on screen */
    function countUp() {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        var els = document.querySelectorAll(".about-stats [data-count]");
        if (!els.length || !window.IntersectionObserver) return;
        var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (e) {
                if (!e.isIntersecting) return;
                io.unobserve(e.target);
                var target = parseInt(e.target.dataset.count, 10), t0 = null;
                function step(t) {
                    if (!t0) t0 = t;
                    var p = Math.min((t - t0) / 900, 1);
                    e.target.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
                    if (p < 1) requestAnimationFrame(step);
                }
                requestAnimationFrame(step);
            });
        }, { threshold: 0.4 });
        els.forEach(function (el) { io.observe(el); });
    }

    var t;
    function schedule() { clearTimeout(t); t = setTimeout(render, 60); }

    // The footer runs before layout has settled in some browsers, and a
    // zero-height box would build nothing — so render now, again after
    // load, and whenever the boxes actually get a size.
    render();
    countUp();
    requestAnimationFrame(render);
    startLoop();
    window.addEventListener("load", schedule);

    if (window.ResizeObserver) {
        var ro = new ResizeObserver(schedule);
        document.querySelectorAll("[data-skill-graph], canvas[data-paint]").forEach(function (el) {
            ro.observe(el.dataset.paint ? el.parentElement : el);
        });
    }

    // repaint on the colour-scheme toggle
    new MutationObserver(render).observe(document.documentElement, {
        attributes: true, attributeFilter: ["data-scheme"]
    });
    window.addEventListener("resize", schedule);
})();
</script>
